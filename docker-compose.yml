services:
  news_proxy:
    container_name: news_proxy
    hostname: news_proxy
    restart: "always"
    image: news_proxy
    build:
      context: ./
      dockerfile: ./Dockerfile
    init: true
    stdin_open: true
    environment:
      - DEBUG=true
      - BROWSER_ENGINE=cloak
    ports:
      - "3123:3000"
    networks:
      - core_network
    cap_add:
      - SYS_ADMIN
    volumes:
      # Persist the auto-downloaded cloak stealth-Chromium binary across restarts.
      - cloak_cache:/home/pptruser/.cloakbrowser

networks:
  core_network:
    external: true

volumes:
  cloak_cache:
