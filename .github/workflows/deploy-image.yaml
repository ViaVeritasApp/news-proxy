name: Build & publish

# Push -> build -> GCP Artifact Registry. Nothing here talks to the cluster: it is
# VPN-only, so Flux pulls. This job's whole job is to publish a tag and poke Flux
# into scanning early. See ViaVeritasApp/k3s, README section 6.

on:
  push:
    branches: [dev, staging]
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write          # required for Workload Identity Federation

env:
  PROJECT_ID: viaveritas
  REGION: europe-west3
  # The proxy shares the `news` repository with the scraper, not `global`.
  AR_REPO: news
  IMAGE: news-proxy

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    # Higher than the other components': this image installs google-chrome-stable
    # plus CJK/Thai/Arabic font packages, so a cold cache is a long build. Warm
    # builds hit the gha cache and finish in a couple of minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Derive image tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%s)
          case "$GITHUB_REF" in
            refs/heads/dev)     TAG="dev-${SHA}-${TS}" ;;
            refs/heads/staging) TAG="staging-${SHA}-${TS}" ;;
            refs/tags/v*)       TAG="rel-${GITHUB_REF#refs/tags/v}-${TS}" ;;
            *) echo "unexpected ref $GITHUB_REF" >&2; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URL=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          # Repository variable: it carries the GCP project *number*, which cannot
          # be written literally here. Unset, it expands to an empty string and the
          # action fails on a malformed audience without naming the variable.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-actions@viaveritas.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.IMAGE_URL }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations publish extra sha256-*.att tags that clutter the registry
          # and confuse Flux's tag scanning.
          provenance: false

      # Tells Flux to scan now instead of waiting out the 10m interval. The body is
      # signed but Flux ignores its contents - it is here so the request is readable
      # in notification-controller's logs.
      - name: Trigger Flux
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          BODY=$(printf '{"repository":"%s","tag":"%s","image":"%s","commit":"%s"}' \
            "${{ env.IMAGE }}" "${{ steps.tag.outputs.TAG }}" \
            "${{ steps.tag.outputs.IMAGE_URL }}" "${{ github.sha }}")

          # Signature is over the exact bytes sent, so no trailing newline.
          SIG=$(printf '%s' "$BODY" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_TOKEN" | sed 's/^.*= //')

          curl -sSf --retry 3 --retry-delay 5 -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Signature: sha256=${SIG}" \
            -d "$BODY"

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.tag.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Flux notified; falls back to the 10m scan if the webhook failed." >> $GITHUB_STEP_SUMMARY
